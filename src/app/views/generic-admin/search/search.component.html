<div class="search-div">
    <input
      type="search"
      class="form-control p-2 sizeinput"
      [(ngModel)]="searchTerm"
      (input)="onSearch($event)"
      placeholder="Search by organization name"
      autocomplete="off"
    />
    <i class="bi bi-search" id="search-icon-tab"></i>
  </div>
