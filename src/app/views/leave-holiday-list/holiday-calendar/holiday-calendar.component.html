
   <div style="padding: 30px;">

  
      <input type="file" class="file" (change)="onFileSelected($event)" accept=".xlsx, .xls" [(ngModel)]="fileUpload" #inputEl/>
      
        <button mat-icon-button type="button"  (click)="submit()" ngbTooltip="Submit">
            <i class="bi bi-arrow-up-right-square-fill"></i>
        </button>
    </div>
    <div class="bg p-1">
    <mat-card>
        <mat-card-header>
          <mat-card-title>Holiday List</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <mat-list>
            <mat-list-item *ngFor="let holiday of holidays" style="border:1px solid #ececec">
              <div mat-line>{{ holiday.name }}</div>
              <div mat-line>{{ holiday.date | date: 'MMMM d, yyyy' }}</div>
             
            </mat-list-item>
          </mat-list>
        </mat-card-content>
      </mat-card>
      
</div>
