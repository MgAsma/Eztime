
<div class="container-wrapper webView">
  <div class="row pb-3">
    <div class="col-sm-4 search-div">
      <app-search (search)="onSearch($event)"></app-search> 
    </div>
    <div class="col-sm"></div>
    <div class="col-md-3 col-lg-3 p-1 text-end">
      <button mat-raised-button class="proceedbtn mat-btn-s" routerLink="/admin/add-admin" type="submit">Add Admins</button>
    </div>
  </div>
  <div class="bg">
    <div class="row">
      <div class="col px-0">
        <div class="row">

        </div>
        <app-generic-admin-list
        [data]="organizationData"
        
        (edit)="onEdit($event)"
        (delete)="onDelete($event)"
        (sort)="onSort($event)"
      ></app-generic-admin-list>

      </div>
    </div>

  </div>
 
 
  <div class="w-100">
    <!-- Pagination Controls (Center-Aligned) 
    <pagination-controls previousLabel="Prev" nextLabel="Next" (pageChange)="onTableDataChange($event)">
    </pagination-controls>
  
    <!-- Items Per Page Selector (Right-Aligned) 
    <div class="items-per-page-container">
      <div>Items per page</div>
      <mat-select [(ngModel)]="tableSize" (selectionChange)="onTableSizeChange($event)" placeholder="10" class="page-size">
        <mat-option *ngFor="let size of tableSizes" [value]="size">{{size}}</mat-option>
      </mat-select>
    </div>-->
    <app-pagination
    [itemsPerPage]="pageSize"
    [pageSizes]="tableSizes"
    (pageChange)="onPageChange($event)"
    (itemsPerPageChange)="onItemsPerPageChange($event)"
  ></app-pagination>
  </div> 
  
  

</div>
